<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1400" viewBox="0 0 1800 1400"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="#555"/></marker></defs><text x="50" y="65.6" font-family="Arial" font-size="42" font-weight="bold">TravelMate actors and supported use cases</text><path d="M 450 217.5 L 650 220.0" stroke="#555" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M 450 517.5 L 650 500.0" stroke="#555" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M 450 817.5 L 650 810.0" stroke="#555" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M 450 1097.5 L 650 1100.0" stroke="#555" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="60" y="150" width="390" height="135" rx="12" fill="#f5f5f5" stroke="#555" stroke-width="3"/><text x="80" y="202.1" font-family="Arial" font-size="32" font-weight="bold">Guest</text><text x="80" y="243.1" font-family="Arial" font-size="32" font-weight="normal">Unauthenticated state</text><rect x="650" y="130" width="1050" height="180" rx="12" fill="#f5f5f5" stroke="#555" stroke-width="3"/><text x="670" y="184.1" font-family="Arial" font-size="32" font-weight="bold">Discover and enter account</text><text x="670" y="225.1" font-family="Arial" font-size="32" font-weight="normal">Earth, country card, credits, legal pages,</text><text x="670" y="266.1" font-family="Arial" font-size="32" font-weight="normal">register/login/recovery</text><rect x="60" y="450" width="390" height="135" rx="12" fill="#f5f5f5" stroke="#555" stroke-width="3"/><text x="80" y="502.1" font-family="Arial" font-size="32" font-weight="bold">Traveler</text><text x="80" y="543.1" font-family="Arial" font-size="32" font-weight="normal">Active account</text><rect x="650" y="400" width="1050" height="200" rx="12" fill="#f5f5f5" stroke="#555" stroke-width="3"/><text x="670" y="464.1" font-family="Arial" font-size="32" font-weight="bold">Plan and manage own travel</text><text x="670" y="505.1" font-family="Arial" font-size="32" font-weight="normal">Destination, generation, costs, saved versions, maps, day</text><text x="670" y="546.1" font-family="Arial" font-size="32" font-weight="normal">actions and actual visits</text><rect x="60" y="750" width="390" height="135" rx="12" fill="#f5f5f5" stroke="#555" stroke-width="3"/><text x="80" y="802.1" font-family="Arial" font-size="32" font-weight="bold">Suspended traveler</text><text x="80" y="843.1" font-family="Arial" font-size="32" font-weight="normal">Restricted account</text><rect x="650" y="730" width="1050" height="160" rx="12" fill="#f5f5f5" stroke="#555" stroke-width="3"/><text x="670" y="794.6" font-family="Arial" font-size="32" font-weight="bold">Read notices and appeal</text><text x="670" y="835.6" font-family="Arial" font-size="32" font-weight="normal">One pending appeal; no ordinary workspace access</text><rect x="60" y="1030" width="390" height="135" rx="12" fill="#f5f5f5" stroke="#555" stroke-width="3"/><text x="80" y="1082.1" font-family="Arial" font-size="32" font-weight="bold">Administrator</text><text x="80" y="1123.1" font-family="Arial" font-size="32" font-weight="normal">Provisioned role</text><rect x="650" y="1010" width="1050" height="180" rx="12" fill="#f5f5f5" stroke="#555" stroke-width="3"/><text x="670" y="1064.1" font-family="Arial" font-size="32" font-weight="bold">Review and moderate</text><text x="670" y="1105.1" font-family="Arial" font-size="32" font-weight="normal">Users, reports, appeals, feedback, notices, metrics and</text><text x="670" y="1146.1" font-family="Arial" font-size="32" font-weight="normal">system records</text><text x="50" y="1308.2" font-family="Arial" font-size="29" font-weight="normal">Guest is not a persisted role. No owner, payment, booking or guest chatbot use case is implemented.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1300" viewBox="0 0 1800 1300"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="#555"/></marker></defs><text x="50" y="65.6" font-family="Arial" font-size="42" font-weight="bold">TravelMate system architecture</text><path d="M 900.0 280 L 900.0 380" stroke="#555" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="857.0" y="314.0" width="86" height="39" fill="white"/><text x="864.0" y="339.6" font-family="Arial" font-size="27" font-weight="normal">HTTP</text><path d="M 900.0 530 L 900.0 630" stroke="#555" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="818.0" y="564.0" width="164" height="39" fill="white"/><text x="825.0" y="589.6" font-family="Arial" font-size="27" font-weight="normal">HTTP / SSE</text><path d="M 900.0 780 L 300.0 900" stroke="#555" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="519.0" y="824.0" width="162" height="39" fill="white"/><text x="526.0" y="849.6" font-family="Arial" font-size="27" font-weight="normal">transactions</text><path d="M 900.0 780 L 900.0 900" stroke="#555" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="866.0" y="824.0" width="68" height="39" fill="white"/><text x="873.0" y="849.6" font-family="Arial" font-size="27" font-weight="normal">read</text><path d="M 1320 705.0 L 1250 990.0" stroke="#555" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="1169.0" y="831.5" width="232" height="39" fill="white"/><text x="1176.0" y="857.1" font-family="Arial" font-size="27" font-weight="normal">bounded requests</text><rect x="480" y="130" width="840" height="150" rx="12" fill="#f5f5f5" stroke="#555" stroke-width="3"/><text x="500" y="169.1" font-family="Arial" font-size="32" font-weight="bold">Browser</text><text x="500" y="210.1" font-family="Arial" font-size="32" font-weight="normal">Public Earth and account dialogs; traveler and</text><text x="500" y="251.1" font-family="Arial" font-size="32" font-weight="normal">admin workspaces</text><rect x="480" y="380" width="840" height="150" rx="12" fill="#f5f5f5" stroke="#555" stroke-width="3"/><text x="500" y="419.1" font-family="Arial" font-size="32" font-weight="bold">Next.js App Router</text><text x="500" y="460.1" font-family="Arial" font-size="32" font-weight="normal">React state, same-origin API services, proxy</text><text x="500" y="501.1" font-family="Arial" font-size="32" font-weight="normal">and OAuth forwarding</text><rect x="480" y="630" width="840" height="150" rx="12" fill="#f5f5f5" stroke="#555" stroke-width="3"/><text x="500" y="669.1" font-family="Arial" font-size="32" font-weight="bold">Express API</text><text x="500" y="710.1" font-family="Arial" font-size="32" font-weight="normal">Auth and owner checks; schemas; controllers</text><text x="500" y="751.1" font-family="Arial" font-size="32" font-weight="normal">and business services</text><rect x="50" y="900" width="500" height="180" rx="12" fill="#f5f5f5" stroke="#555" stroke-width="3"/><text x="70" y="933.6" font-family="Arial" font-size="32" font-weight="bold">Prisma and PostgreSQL</text><text x="70" y="974.6" font-family="Arial" font-size="32" font-weight="normal">Users, trips, versions,</text><text x="70" y="1015.6" font-family="Arial" font-size="32" font-weight="normal">visits, moderation and</text><text x="70" y="1056.6" font-family="Arial" font-size="32" font-weight="normal">history</text><rect x="650" y="900" width="500" height="180" rx="12" fill="#f5f5f5" stroke="#555" stroke-width="3"/><text x="670" y="954.1" font-family="Arial" font-size="32" font-weight="bold">Local reference data</text><text x="670" y="995.1" font-family="Arial" font-size="32" font-weight="normal">GeoNames, PSGC and</text><text x="670" y="1036.1" font-family="Arial" font-size="32" font-weight="normal">country/photo manifests</text><rect x="1250" y="900" width="500" height="180" rx="12" fill="#f5f5f5" stroke="#555" stroke-width="3"/><text x="1270" y="954.1" font-family="Arial" font-size="32" font-weight="bold">External adapters</text><text x="1270" y="995.1" font-family="Arial" font-size="32" font-weight="normal">AI, mail, reference places,</text><text x="1270" y="1036.1" font-family="Arial" font-size="32" font-weight="normal">lodging, maps and weather</text><text x="50" y="1208.2" font-family="Arial" font-size="29" font-weight="normal">Public Earth assets are loaded by the browser. No autonomous generation worker was located.</text></svg>
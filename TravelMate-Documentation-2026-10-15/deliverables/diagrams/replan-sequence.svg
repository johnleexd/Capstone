<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320"><text x="40" y="58.6" font-family="Arial" font-size="42" font-weight="bold">Remaining day preview and acceptance</text><rect x="20.0" y="115" width="360" height="80" fill="#f5f5f5" stroke="#555"/><text x="38.0" y="161.2" font-family="Arial" font-size="29" font-weight="bold">Traveler UI</text><path d="M200.0 195 V1190" stroke="#999" stroke-dasharray="6 6"/><rect x="486.66666666666674" y="115" width="360" height="80" fill="#f5f5f5" stroke="#555"/><text x="504.66666666666674" y="161.2" font-family="Arial" font-size="29" font-weight="bold">Replan service</text><path d="M666.6666666666667 195 V1190" stroke="#999" stroke-dasharray="6 6"/><rect x="953.3333333333335" y="115" width="360" height="80" fill="#f5f5f5" stroke="#555"/><text x="971.3333333333335" y="161.2" font-family="Arial" font-size="29" font-weight="bold">AI and routing</text><path d="M1133.3333333333335 195 V1190" stroke="#999" stroke-dasharray="6 6"/><rect x="1420.0" y="115" width="360" height="80" fill="#f5f5f5" stroke="#555"/><text x="1438.0" y="161.2" font-family="Arial" font-size="29" font-weight="bold">PostgreSQL</text><path d="M1600.0 195 V1190" stroke="#999" stroke-dasharray="6 6"/><path d="M200.0 270 L666.6666666666667 270" stroke="#444" stroke-width="3"/><text x="212.0" y="223.2" font-family="Arial" font-size="29" font-weight="normal">1. Request remaining-day preview for owned trip/revision</text><path d="M666.6666666666667 385 L1600.0 385" stroke="#444" stroke-width="3"/><text x="678.6666666666667" y="338.2" font-family="Arial" font-size="29" font-weight="normal">2. Read current trip and enforce shared rate budget</text><path d="M666.6666666666667 500 L1133.3333333333335 500" stroke="#444" stroke-width="3"/><text x="678.6666666666667" y="453.2" font-family="Arial" font-size="29" font-weight="normal">3. Validate only remaining IDs, durations and transfers</text><path d="M666.6666666666667 615 L200.0 615" stroke="#444" stroke-width="3"/><text x="212.0" y="568.2" font-family="Arial" font-size="29" font-weight="normal">4. Return signed 15-minute owner/trip/revision preview</text><path d="M200.0 730 L666.6666666666667 730" stroke="#444" stroke-width="3"/><text x="212.0" y="683.2" font-family="Arial" font-size="29" font-weight="normal">5. Accept with confirmation, or cancel without plan write</text><path d="M666.6666666666667 845 L1600.0 845" stroke="#444" stroke-width="3"/><text x="678.6666666666667" y="798.2" font-family="Arial" font-size="29" font-weight="normal">6. Lock and reject stale/expired/wrong-owner preview</text><path d="M666.6666666666667 960 L1600.0 960" stroke="#444" stroke-width="3"/><text x="678.6666666666667" y="913.2" font-family="Arial" font-size="29" font-weight="normal">7. Apply permitted changes and append version/history</text><path d="M666.6666666666667 1075 L200.0 1075" stroke="#444" stroke-width="3"/><text x="212.0" y="1028.2" font-family="Arial" font-size="29" font-weight="normal">8. Return saved plan and new revision</text><text x="40" y="1242.4" font-family="Arial" font-size="28" font-weight="normal">Preview performs provider/limiter work but does not write the itinerary/version. Cancel does not guarantee</text><text x="40" y="1277.4" font-family="Arial" font-size="28" font-weight="normal">remote billing cancellation.</text></svg>
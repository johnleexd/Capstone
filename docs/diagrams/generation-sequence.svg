<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1435"><text x="40" y="58.6" font-family="Arial" font-size="42" font-weight="bold">Generation then separate autosave</text><rect x="20.0" y="115" width="360" height="80" fill="#f5f5f5" stroke="#555"/><text x="38.0" y="161.2" font-family="Arial" font-size="29" font-weight="bold">Traveler UI</text><path d="M200.0 195 V1305" stroke="#999" stroke-dasharray="6 6"/><rect x="486.66666666666674" y="115" width="360" height="80" fill="#f5f5f5" stroke="#555"/><text x="504.66666666666674" y="161.2" font-family="Arial" font-size="29" font-weight="bold">Express services</text><path d="M666.6666666666667 195 V1305" stroke="#999" stroke-dasharray="6 6"/><rect x="953.3333333333335" y="115" width="360" height="80" fill="#f5f5f5" stroke="#555"/><text x="971.3333333333335" y="161.2" font-family="Arial" font-size="29" font-weight="bold">Sources and AI</text><path d="M1133.3333333333335 195 V1305" stroke="#999" stroke-dasharray="6 6"/><rect x="1420.0" y="115" width="360" height="80" fill="#f5f5f5" stroke="#555"/><text x="1438.0" y="161.2" font-family="Arial" font-size="29" font-weight="bold">PostgreSQL</text><path d="M1600.0 195 V1305" stroke="#999" stroke-dasharray="6 6"/><path d="M200.0 270 L666.6666666666667 270" stroke="#444" stroke-width="3"/><text x="212.0" y="223.2" font-family="Arial" font-size="29" font-weight="normal">1. Submit confirmed brief and idempotency key</text><path d="M666.6666666666667 385 L1600.0 385" stroke="#444" stroke-width="3"/><text x="678.6666666666667" y="338.2" font-family="Arial" font-size="29" font-weight="normal">2. Begin/replay owner and request-hash record</text><path d="M666.6666666666667 500 L1133.3333333333335 500" stroke="#444" stroke-width="3"/><text x="678.6666666666667" y="453.2" font-family="Arial" font-size="29" font-weight="normal">3. Load permitted venues; request bounded ID schedule</text><path d="M1133.3333333333335 615 L666.6666666666667 615" stroke="#444" stroke-width="3"/><text x="678.6666666666667" y="568.2" font-family="Arial" font-size="29" font-weight="normal">4. Return references or labeled provider failure</text><path d="M666.6666666666667 730 L1600.0 730" stroke="#444" stroke-width="3"/><text x="678.6666666666667" y="683.2" font-family="Arial" font-size="29" font-weight="normal">5. Store terminal generation result with attempt fencing</text><path d="M666.6666666666667 845 L200.0 845" stroke="#444" stroke-width="3"/><text x="212.0" y="798.2" font-family="Arial" font-size="29" font-weight="normal">6. Return validated schedule, costs and notices</text><path d="M200.0 960 L666.6666666666667 960" stroke="#444" stroke-width="3"/><text x="212.0" y="913.2" font-family="Arial" font-size="29" font-weight="normal">7. Explicit autosave with save identity and grounding</text><path d="M666.6666666666667 1075 L1600.0 1075" stroke="#444" stroke-width="3"/><text x="678.6666666666667" y="1028.2" font-family="Arial" font-size="29" font-weight="normal">8. Transaction: Trip, version and audit</text><path d="M666.6666666666667 1190 L200.0 1190" stroke="#444" stroke-width="3"/><text x="212.0" y="1143.2" font-family="Arial" font-size="29" font-weight="normal">9. Saved identity or failure with recoverable local draft</text><text x="40" y="1357.4" font-family="Arial" font-size="28" font-weight="normal">Validation/reconciliation occurs inside services before terminal result. Generation success alone is not a</text><text x="40" y="1392.4" font-family="Arial" font-size="28" font-weight="normal">saved trip.</text></svg>
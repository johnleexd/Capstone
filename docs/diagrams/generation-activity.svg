y="Arial" font-size="32" font-weight="normal">dates and hash</text><rect x="580" y="360" width="640" height="130" rx="12" fill="#f5f5f5" stroke="#555" stroke-width="3"/><text x="600" y="389.1" font-family="Arial" font-size="32" font-weight="bold">Load and validate physical venues</text><text x="600" y="430.1" font-family="Arial" font-size="32" font-weight="normal">Country/admin evidence, source</text><text x="600" y="471.1" font-family="Arial" font-size="32" font-weight="normal">identity and costs</text><rect x="40" y="620" width="760" height="170" rx="12" fill="#f5f5f5" stroke="#555" stroke-width="3"/><text x="60" y="669.1" font-family="Arial" font-size="32" font-weight="bold">Configured AI schedule</text><text x="60" y="710.1" font-family="Arial" font-size="32" font-weight="normal">Allowed IDs/times only; &lt;=7 day batches;</text><text x="60" y="751.1" font-family="Arial" font-size="32" font-weight="normal">one repair then next configured provider</text><rect x="1000" y="620" width="760" height="170" rx="12" fill="#f5f5f5" stroke="#555" stroke-width="3"/><text x="1020" y="648.6" font-family="Arial" font-size="32" font-weight="bold">AI unavailable or invalid</text><text x="1020" y="689.6" font-family="Arial" font-size="32" font-weight="normal">Use permitted catalog suggestions;</text><text x="1020" y="730.6" font-family="Arial" font-size="32" font-weight="normal">preserve unavailable/incomplete</text><text x="1020" y="771.6" font-family="Arial" font-size="32" font-weight="normal">disclosures</text><rect x="500" y="910" width="800" height="160" rx="12" fill="#f5f5f5" stroke="#555" stroke-width="3"/><text x="520" y="954.1" font-family="Arial" font-size="32" font-weight="bold">Deterministic reconciliation</text><text x="520" y="995.1" font-family="Arial" font-size="32" font-weight="normal">Windows, transfers, duplicates, meals,</text><text x="520" y="1036.1" font-family="Arial" font-size="32" font-weight="normal">costs, coverage and evidence</text><rect x="500" y="1210" width="800" height="130" rx="12" fill="#f5f5f5" stroke="#555" stroke-width="3"/><text x="520" y="1259.6" font-family="Arial" font-size="32" font-weight="bold">Return grounded result or safe failure</text><text x="520" y="1300.6" font-family="Arial" font-size="32" font-weight="normal">Saving is a separate validated operation</text><text x="50" y="1488.2" font-family="Arial" font-size="29" font-weight="normal">Invalid brief returns a validation error. No provider failure fabricates a venue, price, photo or</text><text x="50" y="1526.2" font-family="Arial" font-size="29" font-weight="normal">successful booking.</text></svg>